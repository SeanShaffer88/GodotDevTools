# Builds the MkDocs site on every pull request and push that touches docs.
# Deploys to GitHub Pages on release tags (v*) and on manual runs only, so
# nothing fails before Pages is enabled (Settings -> Pages -> Source:
# "GitHub Actions"). After enabling, run this workflow once from the Actions tab.
name: Docs

on:
  pull_request:
    paths: ["docs/**", "*.md", "mkdocs.yml", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["docs/**", "*.md", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install --quiet "mkdocs-material==9.*"

      - name: Stage top-level pages
        # mkdocs.yml's nav lists root documents (README, AI_USAGE, ROADMAP,
        # QUALITY); the site is built from docs/, so copy them in.
        run: |
          for f in README.md AI_USAGE.md ROADMAP.md QUALITY.md; do cp "$f" "docs/$f"; done

      - name: Build site
        run: mkdocs build --site-dir site

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
