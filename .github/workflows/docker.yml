name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build image and smoke-test gate entrypoint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image
        run: docker build -t godot-dev-tools .
      - name: Smoke test (help + list needs a project mount)
        run: docker run --rm godot-dev-tools --help
      - name: Standalone parity (no Godot needed)
        run: |
          if python3 tools/standalone/standalone.py naming --dir=demo/naming; then
            echo "Expected exit 2 for the bad naming fixture"
            exit 1
          else
            test "$?" -eq 2
          fi
