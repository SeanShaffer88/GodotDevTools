name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build image and smoke-test gate entrypoint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test mounted-project smoke harness
        run: python3 tests/test_docker_smoke.py
      - name: Test mounted-project gate harness
        run: python3 tests/test_docker_gate.py
      - name: Build image
        shell: bash
        run: |
          set +e
          docker build -t godot-dev-tools . 2>&1 | tee docker-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Docker build failure (last 80 lines)'
              echo '```'
              tail -80 docker-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message=$(tail -60 docker-build.log | tail -c 12000)
            message=${message//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            message=${message//$'\r'/'%0D'}
            echo "::error title=Docker build failed (exit $status)::$message"
          fi
          exit "$status"
      - name: Smoke test image help
        run: docker run --rm godot-dev-tools --help
      - name: Smoke test a mounted project
        run: python3 tests/docker_smoke.py --image godot-dev-tools
      - name: Run full gate in a mounted project
        timeout-minutes: 15
        run: bash tests/docker_gate.sh godot-dev-tools
      - name: Standalone naming regressions (no Godot needed)
        run: python3 tests/test_standalone.py
