name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build image and smoke-test gate entrypoint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image
        shell: bash
        run: |
          set +e
          # The hosted runner's Docker bridge can lose DNS; use its host network
          # for build-time package downloads. This does not change image runtime.
          docker build --network=host -t godot-dev-tools . 2>&1 | tee docker-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Docker build failure (last 80 lines)'
              echo '```'
              tail -80 docker-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message=$(tail -60 docker-build.log | tail -c 12000)
            message=${message//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            message=${message//$'\r'/'%0D'}
            echo "::error title=Docker build failed (exit $status)::$message"
          fi
          exit "$status"
      - name: Smoke test (help + list needs a project mount)
        run: docker run --rm godot-dev-tools --help
      - name: Standalone naming regressions (no Godot needed)
        run: python3 tests/test_standalone.py
