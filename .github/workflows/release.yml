name: Release

# On a version tag (v*), builds the installable zips from addons/ and
# attaches them to a GitHub Release: one zip per tool plus the suite,
# named exactly like the v1.0.0 release assets. Zips are no longer
# committed to the repo root - the release is the only place they live.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  gate:
    name: Gate before release
    uses: ./.github/workflows/tests.yml

  release:
    name: Build zips and publish release
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build per-tool and suite zips
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for pair in \
            accessibility:Accessibility \
            asset_health:AssetHealth \
            audio_sandbox:AudioSandbox \
            batch_profiler:BatchProfiler \
            bt_debugger:BTDebugger \
            build_size:BuildSize \
            camera_orch:CameraOrch \
            cert_check:CertCheck \
            collision_matrix:CollisionMatrix \
            dialogue_quest:DialogueQuest \
            doc_gen:DocGen \
            export_doctor:ExportDoctor \
            flag_simulator:FlagSimulator \
            input_matrix:InputMatrix \
            l10n_matrix:L10nMatrix \
            leak_hunter:LeakHunter \
            naming_conventions:NamingConventions \
            network_sim:NetworkSim \
            performance_gate:PerformanceGate \
            prefab_guard:PrefabGuard \
            proc_anim:ProcAnim \
            release_guard:ReleaseGuard \
            responsive_ui:ResponsiveUI \
            scene_dependency:SceneDependency \
            scene_search:SceneSearch \
            schema_migrator:SchemaMigrator \
            seed_replay:SeedReplay \
            shader_doctor:ShaderDoctor \
            signal_spy:SignalSpy \
            state_coverage:StateCoverage \
            subtitle_audit:SubtitleAudit \
            telemetry_schema:TelemetrySchema \
            test_priority:TestPriority \
            test_runner:TestRunner \
            thermal_sim:ThermalSim \
            tilemap_rules:TilemapRules \
            time_machine:TimeMachine \
            vfs_mock:VFSMock \
            visual_regression:VisualRegression \
            whitebox:Whitebox
          do
            folder="${pair%%:*}"
            name="${pair##*:}"
            zip -qrD "dist/GodotDevTools-${name}-${VERSION}.zip" "addons/${folder}"
          done
          zip -qrD "dist/GodotDevTools-Suite-${VERSION}.zip" addons/
          ls -la dist/

      - name: Create GitHub Release with the zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "GodotDevTools $GITHUB_REF_NAME" \
            --generate-notes
