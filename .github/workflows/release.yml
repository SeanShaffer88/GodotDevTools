name: Release

# On a version tag (v*), builds the installable zips from addons/ and
# attaches them to a GitHub Release: one zip per tool plus the suite,
# named exactly like the v1.0.0 release assets. Zips are no longer
# committed to the repo root - the release is the only place they live.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  gate:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    name: Gate before release
    uses: ./.github/workflows/tests.yml

  release:
    name: Build zips and publish release
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build per-tool and suite zips
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          VERSION="$RELEASE_VERSION"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $VERSION" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            existing=$(git ls-remote --tags origin "refs/tags/$VERSION")
            if [ -n "$existing" ]; then
              echo "Tag $VERSION already exists; refusing to publish a mismatched release." >&2
              exit 1
            fi
          fi
          mkdir -p dist
          for pair in \
            accessibility:Accessibility \
            asset_health:AssetHealth \
            audio_sandbox:AudioSandbox \
            batch_profiler:BatchProfiler \
            bt_debugger:BTDebugger \
            build_size:BuildSize \
            camera_orch:CameraOrch \
            cert_check:CertCheck \
            collision_matrix:CollisionMatrix \
            dialogue_quest:DialogueQuest \
            doc_gen:DocGen \
            export_doctor:ExportDoctor \
            flag_simulator:FlagSimulator \
            input_matrix:InputMatrix \
            l10n_matrix:L10nMatrix \
            leak_hunter:LeakHunter \
            naming_conventions:NamingConventions \
            network_sim:NetworkSim \
            performance_gate:PerformanceGate \
            prefab_guard:PrefabGuard \
            proc_anim:ProcAnim \
            release_guard:ReleaseGuard \
            responsive_ui:ResponsiveUI \
            scene_dependency:SceneDependency \
            scene_search:SceneSearch \
            schema_migrator:SchemaMigrator \
            seed_replay:SeedReplay \
            shader_doctor:ShaderDoctor \
            signal_spy:SignalSpy \
            state_coverage:StateCoverage \
            subtitle_audit:SubtitleAudit \
            telemetry_schema:TelemetrySchema \
            test_priority:TestPriority \
            test_runner:TestRunner \
            thermal_sim:ThermalSim \
            tilemap_rules:TilemapRules \
            time_machine:TimeMachine \
            vfs_mock:VFSMock \
            visual_regression:VisualRegression \
            whitebox:Whitebox \
            particle_budget:ParticleBudget \
            pool_advisor:PoolAdvisor \
            node_paths:NodePaths \
            unused_symbols:UnusedSymbols \
            type_coverage:TypeCoverage \
            script_complexity:ScriptComplexity \
            duplicate_code:DuplicateCode \
            export_ranges:ExportRanges \
            autoload_graph:AutoloadGraph \
            uid_integrity:UIDIntegrity \
            settings_drift:SettingsDrift \
            scene_lint:SceneLint \
            loot_sim:LootSim \
            difficulty_curve:DifficultyCurve \
            damage_sandbox:DamageSandbox \
            xp_curve:XPCurve \
            crafting_graph:CraftingGraph \
            achievements:Achievements \
            wave_budget:WaveBudget \
            rng_fairness:RNGFairness \
            save_bloat:SaveBloat \
            dialogue_vars:DialogueVars \
            font_glyphs:FontGlyphs \
            audio_levels:AudioLevels \
            audio_import:AudioImport \
            atlas_planner:AtlasPlanner \
            texture_filter:TextureFilter \
            mesh_stats:MeshStats \
            light_cost:LightCost \
            env_cost:EnvCost \
            palette_check:PaletteCheck \
            theme_audit:ThemeAudit \
            flaky_tests:FlakyTests \
            golden_snapshot:GoldenSnapshots \
            log_grouper:LogGrouper \
            log_budget:LogBudget \
            trace_diff:TraceDiff \
            input_fuzzer:InputFuzzer \
            warning_baseline:WarningBaseline \
            scene_smoke:SceneSmoke \
            bench_harness:BenchHarness \
            mutation_tester:MutationTester \
            store_assets:StoreAssets \
            android_permissions:AndroidPermissions \
            version_consistency:VersionCheck \
            third_party_notices:ThirdPartyNotices \
            release_notes:ReleaseNotes \
            content_descriptor:ContentDescriptors \
            patch_delta:PatchDelta \
            settings_validator:SettingsValidator \
            a11y_options:A11yOptions \
            handheld_readiness:HandheldReadiness \
            report_schema:ReportSchema \
            sarif_export:SARIFExport \
            junit_export:JUnitExport \
            html_dashboard:HTMLDashboard \
            report_diff:ReportDiff \
            suppressions:Suppressions \
            suite_dispatcher:SuiteDispatcher \
            precommit:Precommit
          do
            folder="${pair%%:*}"
            name="${pair##*:}"
            zip -qrD "dist/GodotDevTools-${name}-${VERSION}.zip" "addons/${folder}"
          done
          zip -qrD "dist/GodotDevTools-Suite-${VERSION}.zip" addons/
          ls -la dist/

      - name: Create GitHub Release with the zips
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "GodotDevTools $RELEASE_VERSION" \
            --generate-notes
