name: Release

# On a version tag (v*), builds the installable zips from addons/ and
# attaches them to a GitHub Release: one zip per tool plus the suite,
# named exactly like the v1.0.0 release assets. Zips are no longer
# committed to the repo root - the release is the only place they live.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  gate:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    name: Gate before release
    uses: ./.github/workflows/tests.yml

  release:
    name: Build zips and publish release
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build per-tool and suite zips
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          VERSION="$RELEASE_VERSION"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $VERSION" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            existing=$(git ls-remote --tags origin "refs/tags/$VERSION")
            if [ -n "$existing" ]; then
              echo "Tag $VERSION already exists; refusing to publish a mismatched release." >&2
              exit 1
            fi
          fi
          python3 tools/release/build_archives.py --tag "$VERSION" --out dist
          ls -la dist/

      - name: Create GitHub Release with the zips
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "GodotDevTools $RELEASE_VERSION" \
            --generate-notes
