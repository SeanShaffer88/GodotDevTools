name: Tests

# Full gate from tests/run_tests.sh, run headless on Linux.
# Godot 4.3-stable and 4.5-stable are verified (see PROJECT_RULES.md / QUALITY.md);
# 4.4/4.6 runs are marked experimental so they gather evidence without
# claiming support until they have passed. Actions are pinned to SHAs (AUDIT F6).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate on Godot ${{ matrix.godot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - godot: 4.3-stable
            experimental: false
          - godot: 4.5-stable
            experimental: false
          - godot: 4.4-stable
            experimental: true
          - godot: 4.6-stable
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Godot ${{ matrix.godot }}
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .godot-bin
          key: godot-${{ matrix.godot }}-linux-x86_64

      - name: Download Godot ${{ matrix.godot }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .godot-bin
          curl -fsSL -o .godot-bin/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}/Godot_v${{ matrix.godot }}_linux.x86_64.zip"
          unzip -q .godot-bin/godot.zip -d .godot-bin
          rm .godot-bin/godot.zip
          chmod +x ".godot-bin/Godot_v${{ matrix.godot }}_linux.x86_64"

      - name: Show Godot version
        run: '".godot-bin/Godot_v${{ matrix.godot }}_linux.x86_64" --headless --version'

      - name: Standalone naming parity with Godot
        run: |
          GDT_GODOT_BIN="$PWD/.godot-bin/Godot_v${{ matrix.godot }}_linux.x86_64" \
            python3 tests/test_standalone.py

      # These suites exercise the new addons before the long full gate. A
      # dependent GDScript parse/runtime error can otherwise leave SceneTree
      # running indefinitely, so bound each invocation and surface its log.
      - name: Preflight new addon suites
        shell: bash
        run: |
          set +e
          failed=0
          for suite in tfd fxe spm cvg dka aoc gdt vfm; do
            log="$RUNNER_TEMP/preflight-$suite.log"
            timeout 30s ".godot-bin/Godot_v${{ matrix.godot }}_linux.x86_64" --headless --path . --script "res://tests/test_$suite.gd" > "$log" 2>&1
            status=$?
            cat "$log"
            if [ "$status" -ne 0 ]; then
              failed=1
              message=$(tail -60 "$log")
              message=${message//'%'/'%25'}
              message=${message//$'\n'/'%0A'}
              message=${message//$'\r'/'%0D'}
              echo "::error title=Preflight $suite failed (exit $status)::$message"
            fi
          done
          exit "$failed"

      - name: Run full gate
        shell: bash
        run: |
          set +e
          timeout 600s sh tests/run_tests.sh ".godot-bin/Godot_v${{ matrix.godot }}_linux.x86_64" 2>&1 | tee gate.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Gate failure (last 100 lines)'
              echo '```'
              tail -100 gate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message=$(grep -E '^FAIL|SCRIPT ERROR|Parse Error|[1-9][0-9]* failed|^Error:' gate.log | tail -30)
            if [ -z "$message" ]; then message=$(tail -20 gate.log); fi
            message=${message//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            message=${message//$'\r'/'%0D'}
            echo "::error title=Gate failure::$message"
          fi
          exit "$status"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports-godot-${{ matrix.godot }}
          path: |
            reports/
            visual_reports/
          if-no-files-found: ignore

  sessions:
    name: Editor and live-game sessions (Godot 4.3, Xvfb)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Godot 4.3-stable
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .godot-bin
          key: godot-4.3-stable-linux-x86_64

      - name: Download Godot 4.3-stable
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .godot-bin
          curl -fsSL -o .godot-bin/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q .godot-bin/godot.zip -d .godot-bin
          rm .godot-bin/godot.zip
          chmod +x ".godot-bin/Godot_v4.3-stable_linux.x86_64"

      - name: Install virtual display and software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 >/dev/null

      - name: Live game session (runtime nodes)
        run: sh tests/game/run_live_game.sh "$PWD/.godot-bin/Godot_v4.3-stable_linux.x86_64"

      - name: Editor session (every dock, real clicks)
        shell: bash
        run: |
          set +e
          sh tests/editor/run_editor_session.sh "$PWD/.godot-bin/Godot_v4.3-stable_linux.x86_64" "$RUNNER_TEMP/edsess" 2>&1 | tee editor-session.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -15 editor-session.log)
            message=${message//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            message=${message//$'\r'/'%0D'}
            echo "::error title=Editor session failed::$message"
          fi
          exit "$status"

      - name: Upload session evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: session-evidence
          path: |
            reports/live_game/
            ${{ runner.temp }}/edsess/reports/editor_verify/
          if-no-files-found: ignore

  action-smoke:
    name: Reusable action smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run the GodotDevTools action on the demo fixtures
        uses: ./.github/actions/godot-dev-tools
        with:
          godot-version: 4.3-stable
          commands: |
            list
            run node_paths --dir=res://demo/code_health
            run report_schema

      - name: The action wrote reports
        run: test -s reports/node_paths/node_paths.json && test -s reports/report_schema/report.schema.json

      - name: Harness safety and reporting regressions
        run: |
          sh tests/dogfood/test_run_dogfood.sh
          python3 tests/dogfood/test_reporting.py
          sh tests/editor/test_scratch_safety.sh

