name: Tests

# Full gate from tests/run_tests.sh, run headless on Linux.
# Godot 4.3-stable is the verified version (see PROJECT_RULES.md / QUALITY.md);
# newer 4.x runs are marked experimental so they gather evidence without
# claiming support until they have passed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate on Godot ${{ matrix.godot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - godot: 4.3-stable
            experimental: false
          - godot: 4.5-stable
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache Godot ${{ matrix.godot }}
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: .godot-bin
          key: godot-${{ matrix.godot }}-linux-x86_64

      - name: Download Godot ${{ matrix.godot }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .godot-bin
          curl -fsSL -o .godot-bin/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}/Godot_v${{ matrix.godot }}_linux.x86_64.zip"
          unzip -q .godot-bin/godot.zip -d .godot-bin
          rm .godot-bin/godot.zip
          chmod +x ".godot-bin/Godot_v${{ matrix.godot }}_linux.x86_64"

      - name: Show Godot version
        run: '".godot-bin/Godot_v${{ matrix.godot }}_linux.x86_64" --headless --version'

      - name: Run full gate
        shell: bash
        run: |
          set +e
          timeout 600s sh tests/run_tests.sh ".godot-bin/Godot_v${{ matrix.godot }}_linux.x86_64" 2>&1 | tee gate.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Gate failure (last 100 lines)'
              echo '```'
              tail -100 gate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message=$(tail -100 gate.log)
            message=${message//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            message=${message//$'\r'/'%0D'}
            echo "::error title=Gate failure::$message"
          fi
          exit "$status"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-godot-${{ matrix.godot }}
          path: |
            reports/
            visual_reports/
          if-no-files-found: ignore

  sessions:
    name: Editor and live-game sessions (Godot 4.3, Xvfb)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache Godot 4.3-stable
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: .godot-bin
          key: godot-4.3-stable-linux-x86_64

      - name: Download Godot 4.3-stable
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .godot-bin
          curl -fsSL -o .godot-bin/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q .godot-bin/godot.zip -d .godot-bin
          rm .godot-bin/godot.zip
          chmod +x ".godot-bin/Godot_v4.3-stable_linux.x86_64"

      - name: Install virtual display and software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 >/dev/null

      - name: Live game session (runtime nodes)
        run: sh tests/game/run_live_game.sh "$PWD/.godot-bin/Godot_v4.3-stable_linux.x86_64"

      - name: Editor session (every dock, real clicks)
        run: sh tests/editor/run_editor_session.sh "$PWD/.godot-bin/Godot_v4.3-stable_linux.x86_64" "$RUNNER_TEMP/edsess"

      - name: Upload session evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-evidence
          path: |
            reports/live_game/
            ${{ runner.temp }}/edsess/reports/editor_verify/
          if-no-files-found: ignore

  action-smoke:
    name: Reusable action smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run the GodotDevTools action on the demo fixtures
        uses: ./.github/actions/godot-dev-tools
        with:
          godot-version: 4.3-stable
          commands: |
            list
            run node_paths --dir=res://demo/code_health
            run report_schema

      - name: The action wrote reports
        run: test -s reports/node_paths/node_paths.json && test -s reports/report_schema/report.schema.json

